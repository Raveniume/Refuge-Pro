name: Compose Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Require release signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'KEYSTORE_BASE64 is not configured'; exit 1; }
          test -n "$KEY_STORE_PASSWORD" || { echo 'KEY_STORE_PASSWORD is not configured'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'KEY_PASSWORD is not configured'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'KEY_ALIAS is not configured'; exit 1; }
      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          {
            echo 'storeFile=app/release.keystore'
            echo "storePassword=$KEY_STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
          } > signing.properties
      - name: Build and test signed APK
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleRelease
      - name: Read changelog section
        id: changelog
        shell: bash
        run: |
          awk -v tag="${GITHUB_REF_NAME#v}" '
            $0 ~ "^## " tag "([[:space:]]|$)" { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
      - name: Publish GitHub release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: Refuge Pro ${{ github.ref_name }}
          body_path: release-notes.md
          files: app/build/outputs/apk/release/app-release.apk
