name: Compose CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify and build review APK
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleReview
      - name: Upload review APK
        uses: actions/upload-artifact@v4
        with:
          name: refuge-review-apk
          path: app/build/outputs/apk/review/app-review.apk
